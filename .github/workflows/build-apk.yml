name: Build ContactBatch APK

on:
workflow_dispatch:
push:
paths:
- 'ContactBatch-source.zip'
- '.github/workflows/build-apk.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check source archive
    run: test -f ContactBatch-source.zip

  - name: Extract Android project
    run: unzip -q ContactBatch-source.zip -d extracted

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build debug APK
    working-directory: extracted
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ContactBatch-debug-apk
      path: extracted/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error

